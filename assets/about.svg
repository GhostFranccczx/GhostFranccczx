<svg width="900" height="308" viewBox="0 0 900 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About me: Hi, Francoo. An IT student exploring the things I like. Currently taking a Bachelor of Science in Information Technology. Programming is about 1 percent of me, I would rather play League of Legends. Exploring the things I like, and I wonder what they are too." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --fg:#111111; --mut:#6b7280; --acc:#e5484d; --line:#e4e4e7; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f5f5f4; --mut:#9ca3af; --acc:#ff6b6b; --line:#27272a; }
    }
    .big { font: 300 38px Georgia, 'Times New Roman', serif; fill: var(--fg); letter-spacing: -1px; }
    .big .ac { font-style: italic; fill: var(--acc); }
    .in  { font: 300 21px Georgia, 'Times New Roman', serif; fill: var(--fg); }
    .in.b { fill: var(--mut); font-style: italic; }
    .sep { stroke: var(--line); stroke-width: 1; }
    .bar { fill: var(--acc); }
    .lab { font: 500 11px 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 3px; fill: var(--mut); }
    .val { font: 300 22px Georgia, 'Times New Roman', serif; fill: var(--fg); }

    .big, .in, .sep, .row { opacity: 0; }
    .L { animation: slideL 10s cubic-bezier(.2,.8,.2,1) infinite; }
    .R { animation: slideR 10s cubic-bezier(.2,.8,.2,1) infinite; }

    @keyframes slideL {
      0%   { opacity: 0; transform: translateX(-140px); }
      9%   { opacity: 1; transform: translateX(0); }
      86%  { opacity: 1; transform: translateX(0); }
      95%  { opacity: 0; transform: translateX(140px); }
      100% { opacity: 0; transform: translateX(-140px); }
    }
    @keyframes slideR {
      0%   { opacity: 0; transform: translateX(140px); }
      9%   { opacity: 1; transform: translateX(0); }
      86%  { opacity: 1; transform: translateX(0); }
      95%  { opacity: 0; transform: translateX(-140px); }
      100% { opacity: 0; transform: translateX(140px); }
    }
  </style>

  <text class="big L" x="30" y="48" style="animation-delay:.10s">Hi, <tspan class="ac">Francoo.</tspan></text>
  <text class="in b L" x="30" y="84" style="animation-delay:.28s">An IT student exploring the things I like.</text>
  <line class="sep L" x1="30" y1="110" x2="870" y2="110" style="animation-delay:.45s"/>
  <g class="row L" style="animation-delay:0.60s">
    <rect class="bar" x="30" y="139" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="155">CURRENTLY</text>
    <text class="val" x="250" y="156">Bachelor of Science in Information Technology</text>
    <line class="sep" x1="30" y1="176" x2="870" y2="176"/>
  </g>
  <g class="row R" style="animation-delay:0.82s">
    <rect class="bar" x="30" y="193" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="209">PROGRAMMING</text>
    <text class="val" x="250" y="210">About 1% of me. I&#8217;d rather play League of Legends.</text>
    <line class="sep" x1="30" y1="230" x2="870" y2="230"/>
  </g>
  <g class="row L" style="animation-delay:1.04s">
    <rect class="bar" x="30" y="247" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="263">EXPLORING</text>
    <text class="val" x="250" y="264">The things I like. What are they? I wonder too.</text>
    <line class="sep" x1="30" y1="284" x2="870" y2="284"/>
  </g>
</svg>
