<svg width="900" height="376" viewBox="0 0 900 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About me: I build things for the web with a focus on clarity, craft, and simplicity. Currently working on your project. Learning your next skill. Ask me about your area of expertise. Fun fact: I run on tofu, not coffee." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --fg:#111111; --mut:#6b7280; --acc:#e5484d; --line:#e4e4e7; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#f5f5f4; --mut:#9ca3af; --acc:#ff6b6b; --line:#27272a; }
    }
    .in  { font: 300 22px Georgia, 'Times New Roman', serif; fill: var(--fg); }
    .in.b { fill: var(--mut); font-style: italic; }
    .sep { stroke: var(--line); stroke-width: 1; }
    .bar { fill: var(--acc); }
    .lab { font: 500 11px 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 3px; fill: var(--mut); }
    .val { font: 300 26px Georgia, 'Times New Roman', serif; fill: var(--fg); }

    .in, .sep, .row { opacity: 0; }
    .L { animation: slideL 10s cubic-bezier(.2,.8,.2,1) infinite; }
    .R { animation: slideR 10s cubic-bezier(.2,.8,.2,1) infinite; }
    .row.L, .row.R { }

    @keyframes slideL {
      0%   { opacity: 0; transform: translateX(-140px); }
      9%   { opacity: 1; transform: translateX(0); }
      86%  { opacity: 1; transform: translateX(0); }
      95%  { opacity: 0; transform: translateX(140px); }
      100% { opacity: 0; transform: translateX(-140px); }
    }
    @keyframes slideR {
      0%   { opacity: 0; transform: translateX(140px); }
      9%   { opacity: 1; transform: translateX(0); }
      86%  { opacity: 1; transform: translateX(0); }
      95%  { opacity: 0; transform: translateX(-140px); }
      100% { opacity: 0; transform: translateX(140px); }
    }
  </style>

  <text class="in a L" x="30" y="44" style="animation-delay:0.10s">I build things for the web with a focus on clarity, craft, and simplicity.</text>
  <text class="in b L" x="30" y="76" style="animation-delay:0.28s">Less noise, more signal. I turn messy problems into clean, usable products.</text>
  <line class="sep L" x1="30" y1="104" x2="870" y2="104" style="animation-delay:.45s"/>
  <g class="row L" style="animation-delay:0.60s">
    <rect class="bar" x="30" y="133" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="149">CURRENTLY</text>
    <text class="val" x="270" y="150">Working on your project</text>
    <line class="sep" x1="30" y1="170" x2="870" y2="170"/>
  </g>
  <g class="row R" style="animation-delay:0.80s">
    <rect class="bar" x="30" y="187" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="203">LEARNING</text>
    <text class="val" x="270" y="204">Your next skill</text>
    <line class="sep" x1="30" y1="224" x2="870" y2="224"/>
  </g>
  <g class="row L" style="animation-delay:1.00s">
    <rect class="bar" x="30" y="241" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="257">ASK ME ABOUT</text>
    <text class="val" x="270" y="258">Your area of expertise</text>
    <line class="sep" x1="30" y1="278" x2="870" y2="278"/>
  </g>
  <g class="row R" style="animation-delay:1.20s">
    <rect class="bar" x="30" y="295" width="3" height="22" rx="1.5"/>
    <text class="lab" x="48" y="311">FUN FACT</text>
    <text class="val" x="270" y="312">I run on tofu, not coffee</text>
    <line class="sep" x1="30" y1="332" x2="870" y2="332"/>
  </g>
</svg>
